[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vora-arc"
version = "0.1.0"
description = "ARC-AGI solver that runs model-written programs in Vora sandboxes"
requires-python = ">=3.13"
dependencies = [
    "vorash",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "matplotlib>=3.9",
]

[project.scripts]
vora-arc = "vora_arc.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "numpy",
    "pixeltable-pgserver>=0.7.2",
]

[tool.uv.sources]
vorash = { git = "ssh://git@github-vorash/vorash/vora.git", subdirectory = "sdk/python", rev = "0cca62dc17515caf60fdfee010298f90dc078801" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["sandbox: runs programs in a real Vora sandbox; needs VORA_API_URL and VORA_API_KEY"]

[tool.mypy]
strict = true
# Hostile programs are sandbox payloads, not package code.
exclude = ["^tests/hostile/"]
